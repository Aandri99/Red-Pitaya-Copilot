location ~ ^/__APP_SLUG__/api/(status|version|stop)$ {
    limit_except GET POST { deny all; }
    client_max_body_size 4k;
    default_type application/json;
    add_header Cache-Control "no-store";
    content_by_lua_file /opt/redpitaya/www/apps/__APP_SLUG__/lua/api.lua;
}

location = /__APP_SLUG__/internal/service/status {
    internal;
    proxy_pass http://127.0.0.1:__SERVICE_PORT__/status;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
}

location = /__APP_SLUG__/internal/service/version {
    internal;
    proxy_pass http://127.0.0.1:__SERVICE_PORT__/version;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
}

location = /__APP_SLUG__/internal/service/stop {
    internal;
    proxy_pass http://127.0.0.1:__SERVICE_PORT__/stop;
    proxy_method POST;
    proxy_set_body "{}";
    proxy_set_header Content-Type application/json;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
}

__WEBSOCKET_NGINX_BLOCK__
